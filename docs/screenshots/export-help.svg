<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">SID OS export and help workflows</title><desc id="desc">Documentation panel showing supported import and export paths.</desc><rect width="1200" height="720" fill="#04070c"/><rect x="42" y="40" width="1116" height="640" rx="14" fill="#091521" stroke="#245c73"/><text x="78" y="92" fill="#65e8ff" font-family="monospace" font-size="27">SYSTEM MANUAL // DATA PIPELINES</text><g font-family="monospace" font-size="17"><text x="85" y="160" fill="#f6c35b">IMPORT</text><text x="85" y="198" fill="#b5cdd5">JSON / JSONL trace → parser → validated frames</text><text x="85" y="236" fill="#b5cdd5">project JSON → validated tracker project</text><text x="85" y="300" fill="#ff75cf">EDIT</text><text x="85" y="338" fill="#b5cdd5">tracker rows · instruments · tempo · loops</text><text x="85" y="376" fill="#b5cdd5">live SID keyboard · mixer · PAL/NTSC timing</text><text x="85" y="440" fill="#64e9a5">EXPORT</text><text x="85" y="478" fill="#b5cdd5">MIDI · WAV · SWM · trace JSON · project JSON</text><text x="85" y="516" fill="#b5cdd5">all processing is client-side in the browser</text><text x="85" y="590" fill="#718c98">SYSTEM_READY enables Web Audio after an explicit user click</text></g></svg>
